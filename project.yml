name: InstantBusiness
options:
  bundleIdPrefix: com.instantbusiness
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "34"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7L2K39BW92

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"

targets:
  InstantBusiness:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: InstantBusiness
      - path: Shared
    settings:
      base:
        # XcodeGen defaults targets to "1,2"; without this the binary ships as
        # iPad-compatible and Apple reviews it on iPad, which this app isn't built for.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.instantbusiness.app
        INFOPLIST_FILE: InstantBusiness/Info.plist
        CODE_SIGN_ENTITLEMENTS: InstantBusiness/InstantBusiness.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: InstantBusinessWidgetExtension
        embed: true
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

  InstantBusinessTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: InstantBusinessTests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.instantbusiness.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: InstantBusiness

  InstantBusinessWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: InstantBusinessWidget
      - path: Shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.instantbusiness.app.widget
        INFOPLIST_FILE: InstantBusinessWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: InstantBusinessWidget/InstantBusinessWidget.entitlements
        SKIP_INSTALL: YES

schemes:
  InstantBusiness:
    build:
      targets:
        InstantBusiness: all
    run:
      config: Debug
      storeKitConfiguration: InstantBusiness/Resources/StoreKitConfig.storekit
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug
      targets:
        - InstantBusinessTests
