name: InstantBusiness
options:
  bundleIdPrefix: com.instantbusiness
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  InstantBusiness:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: InstantBusiness
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.instantbusiness.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Instant Business"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Reçois une citation business chaque jour à l'heure de ton choix."
        CODE_SIGN_ENTITLEMENTS: InstantBusiness/InstantBusiness.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: InstantBusinessWidgetExtension
        embed: true

  InstantBusinessWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: InstantBusinessWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.instantbusiness.app.widget
        INFOPLIST_FILE: InstantBusinessWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: InstantBusinessWidget/InstantBusinessWidget.entitlements
        SKIP_INSTALL: YES

schemes:
  InstantBusiness:
    build:
      targets:
        InstantBusiness: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug
